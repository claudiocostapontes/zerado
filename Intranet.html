<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Intranet</title>
    <style>
        /* Set default styles for the body to ensure consistent layout and background */
        body {
            font-family: sans-serif; /* Use a clean, readable font */
            margin: 20px; /* Add margin around the body for spacing */
            padding: 20px; /* Add padding inside the body for content spacing */
            background-image: url('assets/templogrego.jpg'); /* Set background image */
            background-size: cover; /* Scale image to cover entire body */
            background-position: center; /* Center the background image */
            background-repeat: no-repeat; /* Prevent image from repeating */
            min-height: 100vh; /* Ensure body takes full viewport height */
            display: flex; /* Use flexbox for layout control */
            flex-direction: column; /* Stack children vertically */
        }

        /* Style the main heading */
        h1 {
            text-align: center; /* Center the text */
            margin-bottom: 100px; /* Add large bottom margin for spacing */
            background-color: transparent; /* Ensure no background color */
            padding: 10px; /* Add padding for better appearance */
            color: black; /* Set text color to black for visibility */
        }

        /* Style the header containing navigation */
        .main-header {
            display: flex; /* Use flexbox for layout */
            justify-content: space-between; /* Space out children evenly */
            align-items: center; /* Vertically center children */
            background-color: transparent; /* No background color */
            border: none; /* Remove any border */
            padding: 10px 20px; /* Add padding for spacing */
        }

        /* Style the header title */
        .main-header h2 {
            margin: 0; /* Remove default margin */
            cursor: pointer; /* Indicate clickable element */
            color: black; /* Set text color to black */
            font-size: 24px; /* Set larger font size */
        }

        /* Style the navigation menu list */
        nav ul {
            list-style: none; /* Remove default bullet points */
            padding: 0; /* Remove default padding */
            margin: 0; /* Remove default margin */
            display: flex; /* Display items in a row */
        }

        /* Style navigation links */
        nav ul li a {
            text-decoration: none; /* Remove underline from links */
            color: black; /* Set text color to black */
            padding: 8px 12px; /* Add padding for clickable area */
            border-radius: 5px; /* Round corners for visual appeal */
            font-size: 16px; /* Set font size for readability */
            cursor: pointer; /* Indicate clickable element */
        }

        /* Add hover effect for navigation links */
        nav ul li a:hover {
            background-color: rgba(0, 0, 0, 0.1); /* Light background on hover */
        }

        /* Style the footer */
        footer {
            background-color: transparent; /* No background color */
            padding: 10px 20px; /* Add padding for spacing */
            text-align: center; /* Center text */
            border: none; /* Remove any border */
            margin-top: auto; /* Push footer to bottom of flex container */
        }

        /* Style footer paragraphs */
        footer p {
            margin: 5px 0; /* Add small vertical margin */
            font-size: 13px; /* Set smaller font size */
            color: black; /* Set text color to black */
            font-weight: bold; /* Make text bold */
        }

        /* Style footer links */
        footer a {
            text-decoration: none; /* Remove underline */
            color: black; /* Set text color to black */
            font-weight: bold; /* Make text bold */
        }

        /* Add hover effect for footer links */
        footer a:hover {
            color: black; /* Maintain color on hover */
            text-decoration: underline; /* Add underline on hover */
        }

        /* Style the login overlay */
        .intranet-container {
            display: none; /* Hide by default */
            position: fixed; /* Fix position over viewport */
            top: 0; /* Align to top */
            left: 0; /* Align to left */
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent black overlay */
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
            z-index: 1000; /* Ensure it appears above other content */
        }

        /* Style the login box */
        .login-box {
            background: white; /* White background for contrast */
            padding: 50px; /* Generous padding for spacing / tamanho da caixa de login */
            border-radius: 10px; /* Round corners */
            width: 400px; /* Fixed width */
            text-align: center; /* Center text */
        }

        /* Style input fields in login box */
        .login-box input {
            width: 100%; /* Full width of container */
            padding: 10px; /* Add padding for comfort */
            margin: 10px 0; /* Vertical margin for spacing */
            border: 1px solid black; /* Black border */
            border-radius: 5px; /* Round corners */
            box-sizing: border-box; /* Include padding in width */
        }

        /* Style links in login box */
        .login-box a {
            color: blue; /* Blue text for visibility */
            text-decoration: underline; /* Underline for link appearance */
            display: block; /* Make link a block element */
            margin: 15px 0; /* Vertical margin for spacing */
        }

        /* Style login button */
        .login-box button {
            width: 100%; /* Full width */
            padding: 10px; /* Add padding */
            background: green; /* Green background */
            color: white; /* White text */
            border: none; /* Remove border */
            border-radius: 5px; /* Round corners */
            cursor: pointer; /* Indicate clickable */
        }

        /* Add hover effect for login button */
        .login-box button:hover {
            background: darkgreen; /* Darker green on hover */
        }

        /* Style error messages */
        .error-message {
            color: red; /* Red text for errors */
            margin: 10px 0; /* Vertical margin */
        }

        /* Style the dashboard container */
        .dashboard-container {
            display: none; /* Hide by default */
            flex: 1; /* Take available space */
            flex-direction: column; /* Stack children vertically */
            min-height: 100vh; /* Full viewport height */
        }

        /* Style the dashboard content area */
        .dashboard-content {
            background: white; /* White background */
            padding: 0px; /* Add padding / Retira a Borda do Conteúdo */ 
            border-radius: 10px; /* Round corners */
            width: 80%; /* 80% of parent width */
            max-width: 800px; /* Cap maximum width */
            margin: 20px auto; /* Center with margin */
            text-align: center; /* Center text */
        }

        /* Style the members table */
        .members-table {
            display: none; /* Hide by default */
            width: 100%; /* Full width */
            border-collapse: collapse; /* Merge borders */
            margin-top: 2000px; /* Space above table */
        }

        /* Style table cells */
        .members-table th, .members-table td {
            border: 1px solid black; /* Black border */
            padding: 8px; /* Add padding */
            text-align: left; /* Align text left */
        }

        /* Style table headers */
        .members-table th {
            background-color: white; /* White background */
            color: black; /* Black text */
        }

        /* Style the password input container */
        .password-container {
            position: relative; /* Position children relatively */
            width: 100%; /* Full width */
        }

        /* Adjust password input to accommodate eye icon */
        .password-container input {
            padding-right: 40px; /* Space for eye icon */
        }

        /* Style the password toggle icon */
        .toggle-password {
            position: absolute; /* Position over input */
            right: 10px; /* Align to right */
            top: 50%; /* Center vertically */
            transform: translateY(-50%); /* Adjust vertical alignment */
            cursor: pointer; /* Indicate clickable */
            font-size: 18px; /* Set icon size */
        }

        /* Style the remember-me checkbox container */
        .remember-me {
            display: flex; /* Use flexbox */
            align-items: center; /* Center vertically */
            justify-content: center; /* Center horizontally */
            margin: 10px 0; /* Vertical margin */
        }

        /* Style the remember-me checkbox */
        .remember-me input {
            width: auto; /* Default checkbox size */
            margin-right: 5px; /* Space before label */
        }
    </style>
</head>
<body>
    <div class="intranet-container" id="intranetContainer">
        <div class="login-box" id="loginBox">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="E-mail" required>
            <div class="password-container">
                <input type="password" id="loginPassword" placeholder="Senha" required>
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Lembrar-me</label>
            </div>
            <p class="error-message" id="loginError" style="display: none;"></p>
            <a href="#">Esqueci a senha</a>
            <button onclick="handleLogin()">Log In</button>
            <a href="#" onclick="alert('Registration requires server-side implementation')">Não tem conta? Cadastre-se!</a>
        </div>
    </div>
    <div class="dashboard-container" id="dashboardContainer">
        <header class="main-header">
            <h3 onclick="toggleMembers()"></h3>
            <nav>
                <ul class="menu">
                    <li><a href="membros-da-loja.html">Membros da Loja</a></li>
                    <li><a href="instrucoes-de-aprendiz.html">Instruções Gerais</a></li>
                </ul>
            </nav>
        </header>
        <h1>Guardiões do Templo Nº 3544</h1>
        <main>
            <div class="dashboard-content">
                <table class="members-table" id="membersTable">
                    <thead>
                        <tr>
                            <th>Nome Completo</th>
                            <th>CIM</th>
                            <th>Data de Iniciação</th>
                            <th>Rito</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody">
                        <!-- Member data populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
        <footer>
            <p>Loja Maçonica Guardiões do Templo Nº 3544</p>
            <p>QE 40 Área Especial Nº 6 Lote 01 Guará II</p>
            <p>CNPJ: 19.246.642/0001-01</p>
        </footer>
    </div>
    <script>
        // Hardcoded users for authentication
        const users = [
            { email: "user@example.com", password: "password123" },
            { email: "admin@maconaria.com", password: "admin456" }
        ];

        // Hardcoded member data
        const members = [
            { name: "João Silva Santos", cim: "123456", initiationDate: "15/03/2010", rite: "Escocês" },
            { name: "Maria Oliveira Costa", cim: "789012", initiationDate: "22/07/2015", rite: "York" },
            { name: "Pedro Almeida Souza", cim: "345678", initiationDate: "10/11/2005", rite: "Escocês" },
            { name: "Ana Pereira Lima", cim: "901234", initiationDate: "05/04/2018", rite: "Moderno" }
        ];

        function showLogin() {
            document.getElementById('intranetContainer').style.display = 'flex';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
            const savedEmail = localStorage.getItem('savedEmail');
            const savedPassword = localStorage.getItem('savedPassword');
            if (savedEmail && savedPassword) {
                document.getElementById('loginEmail').value = savedEmail;
                document.getElementById('loginPassword').value = savedPassword;
                document.getElementById('rememberMe').checked = true;
            }
        }

        function showDashboard() {
            document.getElementById('intranetContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'flex';
            document.getElementById('membersTable').style.display = 'none';
            populateMembersTable();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('loginError');

            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                errorMessage.style.display = 'none';
                if (rememberMe) {
                    localStorage.setItem('savedEmail', email);
                    localStorage.setItem('savedPassword', password);
                } else {
                    localStorage.removeItem('savedEmail');
                    localStorage.removeItem('savedPassword');
                }
                showDashboard();
            } else {
                errorMessage.textContent = 'E-mail ou senha inválidos.';
                errorMessage.style.display = 'block';
            }
        }

        function handleLogout() {
            document.getElementById('intranetContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('rememberMe').checked = false;
            showLogin();
        }

        function populateMembersTable() {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            members.forEach(member => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${member.name}</td>
                    <td>${member.cim}</td>
                    <td>${member.initiationDate}</td>
                    <td>${member.rite}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleMembers() {
            const table = document.getElementById('membersTable');
            table.style.display = table.style.display === 'none' ? 'table' : 'none';
        }

        function togglePassword() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '👁️';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        // Show login screen on page load
        showLogin();
    </script>
</body>
</html>
