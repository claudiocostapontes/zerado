<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Intranet</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            padding: 20px;
            background-image: url('assets/templogrego.jpg'); /* Caminho para a imagem */
            background-size: cover; /* Faz a imagem cobrir toda a área */
            background-position: center; /* Centraliza a imagem */
            background-repeat: no-repeat; /* Evita repetição da imagem */
            min-height: 100vh; /* Garante que o body ocupe toda a altura da tela */
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin-bottom: 100px;
            background-color: transparent;
            padding: 10px;
            color: black; /* Changed to black since background image is removed */
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: transparent;
            border: none;
            padding: 10px 20px;
        }

        .main-header h2 {
            margin: 0;
            cursor: pointer;
            color: black;
            font-size: 24px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li a {
            text-decoration: none;
            color: black; /* Changed to black since background image is removed */
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 16px;
        }

        nav ul li a:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        footer {
            background-color: transparent;
            padding: 10px 20px;
            text-align: center;
            border: none;
            margin-top: auto;
        }

        footer p {
            margin: 5px 0;
            font-size: 13px;
            color: black; /* Changed to black since background image is removed */
            font-weight: bold;
        }

        footer a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        footer a:hover {
            color: black;
            text-decoration: underline;
        }

        /* Intranet Container (Login Screen) */
        .intranet-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            padding: 48px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login-box a {
            color: blue;
            text-decoration: underline;
            display: block;
            margin: 15px 0;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: darkgreen;
        }

        .error-message {
            color: red;
            margin: 10px 0;
        }

        /* Dashboard Styles */
        .dashboard-container {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 100vh;
        }

        .dashboard-content {
            background: white;
            padding: 0px; /* borda que estava no meio do código */
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }

        .members-table {
            display: none;
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .members-table th, .members-table td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        .members-table th {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <div class="intranet-container" id="intranetContainer">
        <div class="login-box" id="loginBox">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="E-mail" required>
            <input type="password" id="loginPassword" placeholder="Senha" required>
            <p class="error-message" id="loginError" style="display: none;"></p>
            <a href="#">Esqueci a senha</a>
            <button onclick="handleLogin()">Log In</button>
            <a href="#" onclick="alert('Registration requires server-side implementation')">Não tem conta? Cadastre-se!</a>
        </div>
    </div>
    <div class="dashboard-container" id="dashboardContainer">
        <header class="main-header">
            <h2 onclick="toggleMembers()">Membros da Loja</h2>
            <nav>
                <ul class="menu">
                    <li><a href="membros-da-loja.html"></a></li>
                </ul>
            <script>
                    // Hardcoded member data in head
                const members = [
                    { name: "João Silva Santos", cim: "123456", initiationDate: "15/03/2010", rite: "Escocês" },
                    { name: "Maria Oliveira Costa", cim: "789012", initiationDate: "22/07/2015", rite: "York" },
                    { name: "Pedro Almeida Souza", cim: "345678", initiationDate: "10/11/2005", rite: "Escocês" },
                    { name: "Ana Pereira Lima", cim: "901234", initiationDate: "05/04/2018", rite: "Moderno" }
                    ];
            </script>
            </nav>
        </header>
        <h1>Guardiões do Templo Nº 3544</h1>
        <main>
            <div class="dashboard-content">
                <table class="members-table" id="membersTable">
                    <thead>
                        <tr>
                            <th>Nome Completo</th>
                            <th>CIM</th>
                            <th>Data de Iniciação</th>
                            <th>Rito</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody">
                        <!-- Member data populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
        <footer>
            <p>Loja Maçonica Guardiões do Templo Nº 3544</p>
            <p>QE 40 Área Especial Nº 6 Lote 01 Guará II</p>
            <p>CNPJ: 19.246.642/0001-01</p>
        </footer>
    </div>
    <script>
        // Hardcoded users for authentication
        const users = [
            { email: "user@example.com", password: "password123" },
            { email: "admin@maconaria.com", password: "admin456" }
        ];

        function showLogin() {
            document.getElementById('intranetContainer').style.display = 'flex';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('intranetContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'flex';
            document.getElementById('membersTable').style.display = 'none';
            populateMembersTable();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMessage = document.getElementById('loginError');

            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                errorMessage.style.display = 'none';
                showDashboard();
            } else {
                errorMessage.textContent = 'E-mail ou senha inválidos.';
                errorMessage.style.display = 'block';
            }
        }

        function handleLogout() {
            document.getElementById('intranetContainer').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            showLogin();
        }

        function populateMembersTable() {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            members.forEach(member => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${member.name}</td>
                    <td>${member.cim}</td>
                    <td>${member.initiationDate}</td>
                    <td>${member.rite}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleMembers() {
            const table = document.getElementById('membersTable');
            table.style.display = table.style.display === 'none' ? 'table' : 'none';
        }

        // Show login screen on page load
        showLogin();
    </script>
</body>
</html>
