<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Maçonaria Moderna</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            padding: 20px;
            /* Define a imagem como fundo do body, cobrindo toda a página */
            background-image: url('assets/arca.jpg'); /* Caminho ajustado para a pasta assets */
            background-size: cover; /* Faz a imagem cobrir toda a área */
            background-repeat: no-repeat; /* Evita repetição da imagem */
            background-position: center; /* Centraliza a imagem */
            min-height: 100vh; /* Garante que o body ocupe toda a altura da tela */
        }

        h1 {
            text-align: center;
            margin-bottom: 200px; /* Aumenta a margem inferior para aumentar a distância do footer */
            background-color: transparent; /* Fundo transparente para mostrar a imagem de fundo */
            padding: 200px;
            color: white; /* Garante que o texto seja branco */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* Sombra preta para maior contraste */
        }

        .main-header {
            display: flex; /* Para alinhar a logo e a navegação horizontalmente */
            align-items: center; /* Alinhar verticalmente os itens do header */
            justify-content: space-between; /* Espaçar a logo e a navegação */
            padding: 10px 20px; /* Adiciona um pouco de espaço interno */
            background-color: transparent; /* Fundo transparente para mostrar a imagem de fundo */
            border: none; /* Remove a borda */
        }
        
        .logo-container img {
            width: 140px; /* Aumenta a largura do logo */
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.5)); /* Mantém a sombra para contraste */
        }

        nav ul {
            list-style: none; /* Remove os marcadores de lista */
            padding: 0;
            margin: 0;
            display: flex; /* Alinha os itens da lista horizontalmente */
        }

        nav ul li {
            margin-right: 20px; /* Espaço entre os itens da navbar */
        }

        nav ul li:first-child {
            margin-right: 20px; /* Remove a margem do primeiro item */
        }

        nav ul li a {
            text-decoration: none; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 5px; 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); 
            line-height: 1;
            font-size: 20px; /* Aumente este valor para deixar a letra maior */
            font-weight: bold; /* Opcional: deixa a letra em negrito para destacar mais */
            font-size: 20px; /* Aumente este valor para deixar a letra maior */
            font-weight: bold; /* Opcional: deixa a letra em negrito para destacar mais */
        }

        nav ul li a:hover {
            background-color: rgba(255, 255, 255, 0.3); /* Fundo semitransparente ao passar o mouse */
        }

        .dropdown {
            position: relative;
        }

        .dropbtn {
            background-color: transparent;
            color: blue;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* Sombra preta para maior contraste */
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: blue;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #535252;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .intranet-search {
            display: flex;
            align-items: center;
        }

        footer {
            background-color: transparent; /* Fundo transparente para mostrar a imagem de fundo */
            padding: 10px 20px; /* Espaçamento interno */
            text-align: center; /* Centralizar o conteúdo */
            border: none; /* Mantém as bordas removidas */
            margin-top: 500px; /* Aumenta a margem superior para aumentar a distância do h1 */
        }

        footer p {
            margin: 5px 0; /* Espaçamento entre os parágrafos */
            font-size: 12px; /* Tamanho da fonte preservado */
            color: white; /* Cor do texto alterada para branco */
            font-weight: bold; /* Adiciona negrito ao texto */
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); /* Sombra branca para maior contraste */
        }

        footer a {
            text-decoration: none; /* Remove o sublinhado do link de email */
            color: white; /* Cor do link alterada para branco */
            font-weight: bold; /* Adiciona negrito ao texto */
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5); /* Sombra branca para maior contraste */
        }

        footer a:hover {
            color: white; /* Cor ao passar o mouse mantida como branca */
            text-decoration: underline; /* Sublinhado ao passar o mouse */
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="/assets/logoguardioes.jpg" alt="Logo Guardiões">
        </div>
        <nav>
            <ul class="menu">
                <li><a href="inicio.html">Início</a></li>
                <li><a href="maconaria.html">Maçonaria</a></li>
                <li><a href="galeria-dos-veneraveis.html">Galeria dos Veneráveis</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="calendario-eventos.html">Calendário de Eventos</a></li>
                <li><a href="Intranet.html">Intranet</a></li>
                <li><a href="fale-conosco.html">Fale Conosco</a></li>
            </ul>
        </nav>
        <div class="intranet-search">
            <div class="search-bar">
                </div>
        </div>
    </header>
    
    <main>
        <h1>Guardiões do Templo Nº 3544</h1>
    </main>

    <footer>
        <p>Loja Maçonica Guardiões do Templo Nº 3544</p>
        <p>QE 40 Área Especial Nº 6 Lote 01 Guará II</p>
        <p>CNPJ: 19.246.642/0001-01</p>
    </footer>
</body>
</html>
