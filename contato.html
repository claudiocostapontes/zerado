<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maçonaria Moderna - Contato</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #f2f2f2;
            padding: 20px;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 16px;
            border: 1px solid #000; /*aumenta a largura da borda de preenchimento*/
            border-radius: 4px;
            resize: vertical;
        }

        input[type="submit"] {
            background-color: #04AA6D;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .row {
            display: flex;
            align-items: center; /* Alinha verticalmente os itens */
            gap: 20px; /* Aumenta o espaço entre os elementos */
            margin-bottom: 15px;
        }

        .row > h2 {
            font-size: 1.5em;
            font-weight: bold;
        }

        .error-message {
            color: red;
            display: none;
            margin-bottom: 16px;
        }

        .img-container {
            width: 55px; /* Tamanho ajustado para a imagem */
            height: auto; /* Mantém a proporção */
            display: block; /* Remove float para melhor controle no flex */
        }

        .img-container img {
            width: 150%; /* Garante que a imagem ocupe a largura do contêiner */
            height: auto; /* Mantém a proporção */
            vertical-align: middle; /* Alinha a imagem com o texto */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entre em Contato</h1>
        <div class="row">
            <h2>Destinatário</h2>
            <h2>Guardiões do Templo</h2>
            <div class="img-container">
                <img src="/assets/compasso.png" alt="Compasso">
            </div>
        </div>
        <form action="/submit" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" style="height: 150px" required></textarea>

            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <div id="location-error" class="error-message">
                Não foi possível obter a localização. Por favor, permita o acesso à localização no seu navegador.
            </div>

            <input type="submit" value="Enviar">
        </form>
    </div>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        document.getElementById('location-error').style.display = 'none';
                    },
                    (error) => {
                        document.getElementById('location-error').style.display = 'block';
                    }
                );
            } else {
                document.getElementById('location-error').style.display = 'block';
                document.getElementById('location-error').textContent = 
                    'Geolocalização não é suportada pelo seu navegador.';
            }
        }

        //Solicita a localização quando a página carrega
        window.onload = getLocation;
    </script>
</body>
</html>
